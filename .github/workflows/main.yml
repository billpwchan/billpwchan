name: Profile Dashboard

on:
  schedule:
    - cron: "30 22 * * *"
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - scripts/**
      - .github/workflows/main.yml

permissions:
  contents: write

concurrency:
  group: profile-dashboard
  cancel-in-progress: true

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Render cards, market watch and README sections
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: python scripts/generate.py

      - name: Render isometric calendar
        uses: lowlighter/metrics@v3.34
        continue-on-error: true
        with:
          filename: asset/isocalendar.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: billpwchan
          base: ""
          output_action: none
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      - name: Collect isometric calendar
        run: sudo cp /metrics_renders/asset/isocalendar.svg asset/isocalendar.svg || echo "isocalendar render unavailable, keeping previous"

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add asset README.md
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "chore(dashboard): refresh profile metrics [skip ci]"
          git pull --rebase
          git push

  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: billpwchan
          outputs: |
            dist/snake-light.svg
            dist/snake-dark.svg?palette=github-dark

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: "chore(snake): update contribution snake"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Profile Terminal

# Hourly: the ticker tape, market sessions, risk monitor and derivatives panel are market data.
# Renders go to the `output` branch (force-pushed, no history); the README is static, so master
# only ever carries human commits.
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - scripts/**
      - .github/workflows/main.yml

permissions:
  contents: write

concurrency:
  group: profile-terminal
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      # Start from the last published renders so a failed feed keeps its previous card live.
      - name: Restore previous renders
        uses: actions/checkout@v5
        continue-on-error: true
        with:
          ref: output
          path: dist
      - run: rm -rf dist/.git && mkdir -p dist

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt

      - name: Render cards
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: python scripts/generate.py dist

      - name: Render contribution snake
        uses: Platane/snk/svg-only@v3
        continue-on-error: true
        with:
          github_user_name: billpwchan
          outputs: |
            dist/snake-raw.svg?palette=github-dark&color_snake=#ffb224&color_dots=#161b22,#3b2a07,#7a5410,#c7861a,#ffb224

      - name: Frame snake as a terminal panel
        run: python scripts/frame_snake.py dist

      - name: Validate SVGs
        run: python scripts/check.py dist

      - name: Publish renders to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          keep_history: false
          jekyll: false
          commit_message: "chore(render): refresh profile terminal"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
